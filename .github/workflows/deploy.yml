name: Servidor

# Solo a mano. Un despliegue automatico en cada push manda a produccion commits a medio terminar, y
# aca se empuja directo a la rama sin pull request.
#
# Existe para poder operar el servidor desde una sesion en la nube, que no tiene la llave SSH ni
# Tailscale. Desde cualquier maquina con `gh`:
#
#   gh workflow run deploy.yml -f accion=redesign/completo   # desplegar esa rama
#   gh workflow run deploy.yml -f accion=estado              # pm2 + commit desplegado
#   gh workflow run deploy.yml -f accion=logs                # ultimas 120 lineas
#   gh workflow run deploy.yml -f accion=rollback            # volver al commit anterior
#   gh workflow run deploy.yml -f accion=diagnostico         # clasifica duplicadas, 7 dias, SOLO LEE
#   gh workflow run deploy.yml -f accion=diagnostico:14      # lo mismo, 14 dias
#   gh run watch                                             # seguir la corrida
#   gh run view --log                                        # leer la salida del servidor
on:
  workflow_dispatch:
    inputs:
      accion:
        description: Nombre de rama a desplegar, o estado / logs / rollback
        required: true
        default: redesign/completo
        type: string

# Dos despliegues a la vez dejan el servidor a mitad de camino entre dos commits.
concurrency:
  group: servidor-produccion
  cancel-in-progress: false

jobs:
  operar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preparar la llave
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -m 700 -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # La llave esta anclada en el servidor a scripts/ci-deploy.sh, asi que esto no abre una consola:
      # viaja una sola palabra y el servidor la valida contra su propia lista antes de usarla.
      - name: Ejecutar en el servidor
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          ACCION: ${{ inputs.accion }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "root@${DEPLOY_HOST}" "$ACCION"
