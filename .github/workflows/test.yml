name: Tests

# En TODAS las ramas, no solo master. El trabajo real vive en ramas de feature que se empujan directo,
# sin pull request: con el filtro de rama, el workflow no corria en ninguno de los 13 despliegues del
# 2026-09-17 y las pruebas pasaron solo porque alguien se acordo de correrlas a mano.
on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vendia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vendia_test?schema=public
      # DE MENTIRA A PROPOSITO, no es un olvido. Antes aca viajaba secrets.DEEPSEEK_API_KEY, o sea que
      # un `npm test` cualquiera tenia con que pagarle a DeepSeek. CLAUDE.md lleva TRES incidentes
      # anotados de pruebas que facturaban sin querer, y los tres se "arreglaron" con una regla de
      # nombres (*Paid.ts) que hay que acordarse de cumplir. El 2026-09-18 aparecio el cuarto:
      # src/routes/whatsapp.test.ts dice "Real DeepSeek call (no mocking)" en un comentario y se
      # llamaba .test.ts igual. Estaba escondido porque el archivo moria al importar (ver el arreglo de
      # Groq); al destaparlo, esa corrida se colgo 17 minutos facturando.
      # Una key invalida no es una regla que recordar: es que no hay con que pagar. El SDK necesita un
      # valor NO VACIO para construirse (src/ai/client.ts lo crea al importar), asi que no se puede
      # dejar en blanco - pero con uno invalido la llamada muere en 401 al instante en vez de colgarse.
      # Si un *.test.ts vuelve a llamar a DeepSeek de verdad, CI se pone rojo en segundos y gratis.
      # Las pruebas que SI tienen que llamar de verdad son las *Paid.ts, y esas no las corre CI: las
      # corre el dueño a mano con `npm run test:paid`.
      DEEPSEEK_API_KEY: ci-test-deepseek-key-invalida-a-proposito
      # Y ademas, que ni siquiera haya a donde llamar. La key invalida garantiza que no se puede
      # facturar; esto garantiza que no se pierde tiempo averiguandolo. El puerto 9 (discard) no tiene
      # a nadie escuchando en el propio runner, asi que la conexion muere en el acto con ECONNREFUSED
      # en vez de salir a internet. Medido el 2026-09-18 sin esta variable: la misma suite tarda 4 min
      # 19 s local y 12 min 49 s aca, y esos ~8 minutos son espera de llamadas condenadas a fallar
      # (timeout de 60s + reintento + failover de modelo).
      DEEPSEEK_BASE_URL: http://127.0.0.1:9
      SESSION_SECRET: ci-test-secret
      TOKEN_ENCRYPTION_KEY: ci-test-token-encryption-key
      # Firmar una URL de S3 es una cuenta local, no una llamada a AWS: con region y bucket de mentira
      # el codigo firma igual y la prueba corre sin credenciales reales. Sin estas cuatro variables,
      # src/media/s3.ts corta con "AWS S3 no esta configurado todavia" y npm test queda rojo para
      # siempre - que es como estaba el 2026-09-17, justo cuando el despliegue paso a depender de que
      # este verde.
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: ci-test-bucket
      AWS_ACCESS_KEY_ID: ci-test-access-key
      AWS_SECRET_ACCESS_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # E48. Los dos pasos van ANTES de npm test a proposito: tardan segundos y la suite tarda cuatro
      # minutos y medio, asi que un color literal o un error de tipos se ve enseguida y no al final.
      - name: Sin colores literales fuera de tokens.css
        # La regla del rediseño (CLAUDE.md) es que el unico archivo con colores escritos a mano sea
        # tokens.css: es lo que hace que claro y oscuro sean la MISMA hoja de estilo y no dos. Hasta
        # hoy dependia de que el revisor se acordara de correr este grep antes de cada commit de CSS,
        # y no se acordo: habia 7 literales adentro (la pastilla del emblema en admin y auth, y un
        # #fff sobre fondo de peligro que en tema oscuro quedaba ilegible).
        # grep sale 0 cuando ENCUENTRA algo, que aca es exactamente lo que no queremos.
        run: |
          if grep -nEi '#[0-9a-f]{3,8}\b|rgba?\(' public/admin/css/admin.css public/admin/css/auth.css; then
            echo "::error::Color literal fuera de tokens.css (las lineas de arriba). Agrega el token en public/admin/css/tokens.css y usa var(--onix-*)."
            exit 1
          fi
      - run: npx tsc --noEmit
      - run: npm test
