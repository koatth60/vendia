name: Tests

# En TODAS las ramas, no solo master. El trabajo real vive en ramas de feature que se empujan directo,
# sin pull request: con el filtro de rama, el workflow no corria en ninguno de los 13 despliegues del
# 2026-09-17 y las pruebas pasaron solo porque alguien se acordo de correrlas a mano.
on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vendia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vendia_test?schema=public
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SESSION_SECRET: ci-test-secret
      TOKEN_ENCRYPTION_KEY: ci-test-token-encryption-key
      # Firmar una URL de S3 es una cuenta local, no una llamada a AWS: con region y bucket de mentira
      # el codigo firma igual y la prueba corre sin credenciales reales. Sin estas cuatro variables,
      # src/media/s3.ts corta con "AWS S3 no esta configurado todavia" y npm test queda rojo para
      # siempre - que es como estaba el 2026-09-17, justo cuando el despliegue paso a depender de que
      # este verde.
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: ci-test-bucket
      AWS_ACCESS_KEY_ID: ci-test-access-key
      AWS_SECRET_ACCESS_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
