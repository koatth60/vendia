<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>Zaqi Solutions | Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --green: #1fa855; --green-dark: #16803f; --green-light: #e6f7ec;
    --ink: #12211a; --muted: #5c6e65; --border: #dde6e0; --bg: #fbfdfb; --card: #ffffff;
    --danger: #e5484d; --danger-light: #fdecec;
    --display: "Space Grotesk", system-ui, sans-serif; --body: "Work Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--body); background: var(--bg); margin: 0; color: var(--ink);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px;
    position: relative; overflow: hidden;
  }
  .blob-1 { position: fixed; top: -220px; left: -180px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(31,168,85,0.20) 0%, rgba(31,168,85,0) 70%); filter: blur(10px); pointer-events: none; }
  .blob-2 { position: fixed; bottom: -220px; right: -200px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(156,106,31,0.14) 0%, rgba(156,106,31,0) 70%); filter: blur(10px); pointer-events: none; }
  .back-home { position: relative; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 20px; }
  .back-home:hover { color: var(--green-dark); }
  .card {
    position: relative;
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 36px; width: 100%; max-width: 380px; box-shadow: 0 1px 2px rgba(18,33,26,0.04), 0 20px 48px -12px rgba(18,33,26,0.12);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; justify-content: center; }
  .brand-mark { width: 36px; height: 36px; border-radius: 9px; border: 1px solid rgba(18,33,26,0.12); overflow: hidden; }
  .brand-mark img { width: 100%; height: 100%; display: block; }
  .brand-name { font-family: var(--display); font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  h1 { font-family: var(--display); font-size: 19px; text-align: center; margin: 0 0 24px; font-weight: 600; }
  label { display: block; font-size: 13px; font-weight: 600; margin-top: 14px; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; font-family: inherit; background: #fbfbfc; }
  input:focus { outline: none; border-color: var(--green); background: #fff; }
  button { width: 100%; margin-top: 22px; cursor: pointer; border: none; border-radius: 999px; padding: 12px; font-size: 14px; font-weight: 700; background: var(--ink); color: white; }
  button:hover { opacity: .9; }
  .error { background: var(--danger-light); color: var(--danger); padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-top: 14px; display: none; }
  .foot { text-align: center; font-size: 13px; color: var(--muted); margin-top: 20px; }
  .foot a { color: var(--green-dark); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
  <div class="blob-1"></div>
  <div class="blob-2"></div>
  <a class="back-home" href="/">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    Volver al inicio
  </a>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">
        <img src="/img/zaqi-mark.png" alt="Zaqi Solutions" width="36" height="36" />
      </div>
      <div class="brand-name">zaqi solutions</div>
    </div>
    <h1>Iniciar sesión</h1>
    <form id="login-form">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="email" />
      <label>Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password" />
      <div class="error" id="error"></div>
      <button type="submit">Entrar</button>
    </form>
    <div class="foot" style="margin-top:14px;"><a href="/forgot-password.html">¿Olvidaste tu contraseña?</a></div>
    <div class="foot">¿No tienes cuenta? <a href="/signup.html">Regístrate acá</a></div>
    <div class="foot" style="margin-top:4px;"><a href="/terminos.html">Términos</a> · <a href="/privacidad.html">Privacidad</a></div>
  </div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('error');
  errorEl.style.display = 'none';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const res = await fetch('/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });

  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    errorEl.textContent = data.error || 'No pudimos iniciar sesión';
    errorEl.style.display = 'block';
    return;
  }

  const data = await res.json();
  window.location.href = data.isPlatformAdmin ? '/vendia-admin/' : '/admin/';
});
</script>
</body>
</html>
