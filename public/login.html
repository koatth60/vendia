<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
  /* Fase 0 del rediseno: aplica el tema guardado ANTES de pintar. Si esto se
     mueve al final del body, el usuario ve un fogonazo blanco en cada carga. */
  (function () {
    try {
      var t = localStorage.getItem('onix-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>Zaqi Solutions | Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/admin/css/tokens.css?v=2" />
<link rel="stylesheet" href="/admin/css/auth.css?v=2" />
<script src="/admin/js/theme.js?v=2" defer></script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle auth-theme" type="button"></button>
  <div class="blob-1"></div>
  <div class="blob-2"></div>
  <a class="back-home" href="/">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    Volver al inicio
  </a>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">
        <svg width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Zaqi Solutions"><circle cx="16" cy="16" r="14" fill="var(--onix-logo-disc)"></circle><g transform="translate(4.14 4.39) scale(0.365)" fill="var(--onix-logo-leaf)"><path d="M16 54 L45 20" stroke="var(--onix-logo-leaf)" stroke-width="4.5" stroke-linecap="round" fill="none"></path><ellipse cx="21.0" cy="36.7" rx="8.8" ry="3.9" transform="rotate(-111.5 21.0 36.7)"></ellipse><ellipse cx="26.3" cy="30.9" rx="8.5" ry="3.8" transform="rotate(-111.5 26.3 30.9)"></ellipse><ellipse cx="31.9" cy="25.3" rx="7.8" ry="3.6" transform="rotate(-111.5 31.9 25.3)"></ellipse><ellipse cx="37.4" cy="20.1" rx="6.8" ry="3.3" transform="rotate(-111.5 37.4 20.1)"></ellipse><ellipse cx="32.3" cy="46.3" rx="8.8" ry="3.9" transform="rotate(12.5 32.3 46.3)"></ellipse><ellipse cx="37.2" cy="40.2" rx="8.5" ry="3.8" transform="rotate(12.5 37.2 40.2)"></ellipse><ellipse cx="41.8" cy="33.8" rx="7.8" ry="3.6" transform="rotate(12.5 41.8 33.8)"></ellipse><ellipse cx="46.1" cy="27.5" rx="6.8" ry="3.3" transform="rotate(12.5 46.1 27.5)"></ellipse><ellipse cx="49.6" cy="14.6" rx="7.5" ry="3.6" transform="rotate(-49.5 49.6 14.6)"></ellipse></g></svg>
      </div>
      <div class="brand-name">zaqi solutions</div>
    </div>
    <h1>Iniciar sesión</h1>
    <form id="login-form">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="email" />
      <label>Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password" />
      <div class="error" id="error"></div>
      <button type="submit">Entrar</button>
    </form>
    <div class="foot" style="margin-top:14px;"><a href="/forgot-password.html">¿Olvidaste tu contraseña?</a></div>
    <div class="foot">¿No tienes cuenta? <a href="/signup.html">Regístrate acá</a></div>
    <div class="foot" style="margin-top:4px;"><a href="/terminos.html">Términos</a> · <a href="/privacidad.html">Privacidad</a></div>
  </div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('error');
  errorEl.style.display = 'none';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const res = await fetch('/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });

  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    errorEl.textContent = data.error || 'No pudimos iniciar sesión';
    errorEl.style.display = 'block';
    return;
  }

  const data = await res.json();
  window.location.href = data.isPlatformAdmin ? '/zaqi-admin/' : '/admin/';
});
</script>
</body>
</html>
