<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>Vendia | Recuperar contraseña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --green: #1fa855; --green-dark: #16803f; --green-light: #e6f7ec;
    --ink: #12211a; --muted: #5c6e65; --border: #dde6e0; --bg: #fbfdfb; --card: #ffffff;
    --danger: #e5484d; --danger-light: #fdecec;
    --display: "Space Grotesk", system-ui, sans-serif; --body: "Work Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--body); background: var(--bg); margin: 0; color: var(--ink);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px;
    position: relative; overflow: hidden;
  }
  .blob-1 { position: fixed; top: -220px; left: -180px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(31,168,85,0.20) 0%, rgba(31,168,85,0) 70%); filter: blur(10px); pointer-events: none; }
  .blob-2 { position: fixed; bottom: -220px; right: -200px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(156,106,31,0.14) 0%, rgba(156,106,31,0) 70%); filter: blur(10px); pointer-events: none; }
  .back-home { position: relative; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 20px; }
  .back-home:hover { color: var(--green-dark); }
  .card {
    position: relative;
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 36px; width: 100%; max-width: 380px; box-shadow: 0 1px 2px rgba(18,33,26,0.04), 0 20px 48px -12px rgba(18,33,26,0.12);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; justify-content: center; }
  .brand-mark { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(155deg, var(--green), var(--green-dark)); display: flex; align-items: center; justify-content: center; }
  .brand-name { font-family: var(--display); font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  h1 { font-family: var(--display); font-size: 19px; text-align: center; margin: 0 0 8px; font-weight: 600; }
  .sub { text-align: center; font-size: 13px; color: var(--muted); margin: 0 0 22px; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; margin-top: 14px; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; font-family: inherit; background: #fbfbfc; }
  input:focus { outline: none; border-color: var(--green); background: #fff; }
  button { width: 100%; margin-top: 22px; cursor: pointer; border: none; border-radius: 999px; padding: 12px; font-size: 14px; font-weight: 700; background: var(--ink); color: white; }
  button:hover { opacity: .9; }
  button:disabled { opacity: .6; cursor: default; }
  .error { background: var(--danger-light); color: var(--danger); padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-top: 14px; display: none; }
  .notice { background: var(--green-light); color: var(--green-dark); padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-top: 14px; display: none; line-height: 1.5; }
  .foot { text-align: center; font-size: 13px; color: var(--muted); margin-top: 20px; }
  .foot a { color: var(--green-dark); font-weight: 600; text-decoration: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="blob-1"></div>
  <div class="blob-2"></div>
  <a class="back-home" href="/login.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    Volver a iniciar sesión
  </a>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">
        <svg width="19" height="19" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="20" r="15.5" stroke="white" stroke-width="3.4" fill="none"/>
          <path d="M15 20l9 15 9-15" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-name">vendia</div>
    </div>

    <div id="step-request">
      <h1>Recuperar contraseña</h1>
      <p class="sub">Te mandamos un código de 6 dígitos por WhatsApp, al número de contacto registrado de tu negocio.</p>
      <form id="request-form">
        <label>Email de tu cuenta</label>
        <input type="email" id="request-email" required autocomplete="email" />
        <div class="error" id="request-error"></div>
        <div class="notice" id="request-notice"></div>
        <button type="submit" id="request-submit">Enviar código</button>
      </form>
    </div>

    <div id="step-reset" hidden>
      <h1>Ingresá el código</h1>
      <p class="sub">Revisá el WhatsApp del número de contacto de tu negocio. El código vence en 10 minutos.</p>
      <form id="reset-form">
        <label>Código</label>
        <input type="text" id="reset-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code" />
        <label>Nueva contraseña</label>
        <input type="password" id="reset-password" required minlength="8" autocomplete="new-password" />
        <div class="error" id="reset-error"></div>
        <div class="notice" id="reset-notice"></div>
        <button type="submit" id="reset-submit">Cambiar contraseña</button>
      </form>
    </div>

    <div class="foot">¿Ya la recordaste? <a href="/login.html">Iniciar sesión</a></div>
  </div>

<script>
let currentEmail = '';

document.getElementById('request-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('request-error');
  const noticeEl = document.getElementById('request-notice');
  const submitBtn = document.getElementById('request-submit');
  errorEl.style.display = 'none';
  noticeEl.style.display = 'none';

  currentEmail = document.getElementById('request-email').value.trim();
  submitBtn.disabled = true;
  submitBtn.textContent = 'Enviando...';

  try {
    const res = await fetch('/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: currentEmail }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      errorEl.textContent = data.error || 'No pudimos procesar la solicitud';
      errorEl.style.display = 'block';
      return;
    }
    document.getElementById('step-request').hidden = true;
    document.getElementById('step-reset').hidden = false;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Enviar código';
  }
});

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('reset-error');
  const noticeEl = document.getElementById('reset-notice');
  const submitBtn = document.getElementById('reset-submit');
  errorEl.style.display = 'none';
  noticeEl.style.display = 'none';

  const code = document.getElementById('reset-code').value.trim();
  const newPassword = document.getElementById('reset-password').value;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Cambiando...';

  try {
    const res = await fetch('/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: currentEmail, code, newPassword }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      errorEl.textContent = data.error || 'No pudimos cambiar la contraseña';
      errorEl.style.display = 'block';
      return;
    }
    noticeEl.textContent = 'Contraseña actualizada. Redirigiendo a iniciar sesión...';
    noticeEl.style.display = 'block';
    setTimeout(() => { window.location.href = '/login.html'; }, 1800);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Cambiar contraseña';
  }
});
</script>
</body>
</html>
